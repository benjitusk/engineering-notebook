# Generated by the Firebase CLI (https://github.com/firebase/firebase-tools),
# then extended with Node setup, dependency/build caching, and build env vars.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    # Secrets aren't available to PRs from forks, so only preview same-repo PRs.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 (a dependency needs >= 22.19). `cache: npm` caches ~/.npm keyed
      # on package-lock.json, so `npm ci` doesn't re-download every package.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Astro's build cache (fonts, optimized images); restored after `npm ci`.
      # Same key prefix as the merge workflow, so PRs reuse main's cache.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-

      # No PUBLIC_UMAMI_WEBSITE_ID here, so preview channels don't send traffic
      # to the production analytics.
      - run: npm run build
        env:
          AUTHOR_EMAIL: ${{ secrets.AUTHOR_EMAIL }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENJITUSK_ENGINEERING_NOTEBOOK }}
          projectId: benjitusk-engineering-notebook
