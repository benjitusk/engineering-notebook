# Generated by the Firebase CLI (https://github.com/firebase/firebase-tools),
# then extended with Node setup, dependency/build caching, and build env vars.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history: posts' "last updated" dates come from git log.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22 (a dependency needs >= 22.19). `cache: npm` caches ~/.npm keyed
      # on package-lock.json, so `npm ci` doesn't re-download every package.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Astro's build cache: downloaded fonts and optimized images. It lives in
      # node_modules/.astro, so restore it after `npm ci` (which wipes
      # node_modules). Saved per commit; restores the newest match.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-

      - run: npm run build
        env:
          AUTHOR_EMAIL: ${{ secrets.AUTHOR_EMAIL }}
          # Not a secret (it ships in every page), so it's a repository variable.
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENJITUSK_ENGINEERING_NOTEBOOK }}
          channelId: live
          projectId: benjitusk-engineering-notebook
